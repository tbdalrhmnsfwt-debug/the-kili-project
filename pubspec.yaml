name: zaker_ai
description: "ذاكرلي — Zaker AI. A Flutter study companion for Egyptian students: manhaji books, exams, Quran tools and focus timers."
publish_to: "none"
version: 1.1.0+86

environment:
  sdk: ">=3.4.0 <4.0.0"

# Dependency set limited to the packages the application actually imports,
# plus the plugins whose Android components the manifest or the Kotlin sources
# reference. The original APK's notice manifest lists many more packages, but
# several of them are mutually incompatible (jni 0.7 vs 1.1, llm_core 0.2 vs
# 0.7, intl 0.19 vs flutter_localizations' 0.20) and none of their Dart APIs
# are used here. Keeping the set minimal is what lets `flutter pub get` — and
# therefore the GitHub Actions APK build — resolve.
dependencies:
  flutter:
    path: ../vendor/flutter/flutter
  flutter_localizations:
    path: ../vendor/flutter/flutter_localizations

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1

  # Routing
  go_router: ^14.2.7

  # Local storage
  shared_preferences: ^2.2.3
  path_provider: ^2.1.4

  # Payments
  in_app_purchase: ^3.1.5

  # UI
  flutter_markdown: ^0.7.3+1
  shadcn_ui: ^0.57.3
  hugeicons: ^1.2.0

  # Capture / scanning / OCR
  image_picker: ^1.1.2
  flutter_tesseract_ocr: ^0.4.0

  # Documents
  pdf: ^3.11.1
  printing: ^5.13.1
  syncfusion_flutter_pdf: ^35.1.41
  share_plus: ^10.0.2
  file_picker: ^8.1.2
  url_launcher: ^6.3.0

  # Notifications + home-screen widgets
  home_widget: ^0.7.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Misc
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    path: ../vendor/flutter/flutter_test
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  # Directory entries are not recursive in the Flutter asset bundler, so each
  # level is listed explicitly. The payloads themselves are recovered from the
  # original APK and copied in by tool/sync_assets.sh.
  assets:
    - assets/images/
    - assets/lottie/
    - assets/fonts/
    - assets/shaders/
    - assets/data/
    - assets/dictionary/
    - assets/i18n/
    - assets/quran/
    - assets/tessdata/
    - assets/tessdata_config.json
    - assets/courses/computer/
    - assets/courses/computer/img/
    - assets/manhaji/prep1/
    - assets/manhaji/prep1/figs/
    - assets/manhaji/prep2/
    - assets/manhaji/prep2/figs/
    - assets/manhaji/prep3/
    - assets/manhaji/prep3/figs/
    - assets/manhaji/prim1/
    - assets/manhaji/prim1/figs/
    - assets/manhaji/prim2/
    - assets/manhaji/prim2/figs/
    - assets/manhaji/prim3/
    - assets/manhaji/prim3/figs/
    - assets/manhaji/prim4/
    - assets/manhaji/prim4/figs/
    - assets/manhaji/prim5/
    - assets/manhaji/prim5/figs/
    - assets/manhaji/prim6/
    - assets/manhaji/prim6/figs/
    - assets/manhaji/sec1/
    - assets/manhaji/sec1/figs/
    - assets/manhaji/sec2/
    - assets/manhaji/sec2/figs/
    - assets/manhaji/sec3/
    - assets/manhaji/sec3/figs/
  fonts:
    # The APK ships the UI font as a single Cairo face plus the PDF-embed
    # subsets of the other families; those subsets are valid TTFs and are the
    # only variants present in the extraction.
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
    - family: Tajawal
      fonts:
        - asset: assets/fonts/TajawalPdf-Regular.ttf
        - asset: assets/fonts/TajawalPdf-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/AmiriPdf-Regular.ttf
        - asset: assets/fonts/AmiriPdf-Bold.ttf
          weight: 700
    - family: Naskh
      fonts:
        - asset: assets/fonts/NaskhPdf-Regular.ttf
        - asset: assets/fonts/NaskhPdf-Bold.ttf
          weight: 700
