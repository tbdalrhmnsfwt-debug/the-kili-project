name: Build APK

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Flutter release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The local build on the author's device points Flutter packages at an
      # SDK checkout next to the repository (`../vendor/flutter`). That folder
      # is not committed, so on CI they are switched to the SDK installed by
      # the action above.
      - name: Use the CI Flutter SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pubspec = Path('pubspec.yaml')
          text = pubspec.read_text()
          for package in ('flutter_test', 'flutter_localizations', 'flutter'):
              text = text.replace(f'path: ../vendor/flutter/{package}', 'sdk: flutter')
          pubspec.write_text(text)
          PY
          grep -n "sdk: flutter" pubspec.yaml

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # The repository keeps its Android sources and manifest, but not the
      # Gradle wrapper/templates, so Flutter regenerates the missing platform
      # scaffolding before building.
      - name: Generate Android platform files
        run: >
          flutter create
          --platforms=android
          --project-name zaker_ai
          --org com.zaker
          --no-pub
          .

      # flutter_local_notifications schedules with java.time, so the app module
      # must enable core-library desugaring (the plugin enables it for its own
      # module, but AGP also requires the consuming app to opt in). The Gradle
      # file is generated by the step above, so patch it before building.
      - name: Enable core-library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/app/build.gradle.kts')
          text = path.read_text()
          marker = 'compileOptions {'
          if marker not in text:
              raise SystemExit('unexpected Gradle template: compileOptions not found')
          if 'isCoreLibraryDesugaringEnabled' not in text:
              text = text.replace(
                  marker,
                  marker + '\n        isCoreLibraryDesugaringEnabled = true',
                  1,
              )
          if 'coreLibraryDesugaring' not in text:
              text += '''
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          '''
          path.write_text(text)
          PY
          grep -n "isCoreLibraryDesugaringEnabled\|coreLibraryDesugaring" android/app/build.gradle.kts

      # flutter_tesseract_ocr 0.4.31 (the latest release) still declares
      # `jcenter()`, which Gradle 9 removed, and pins AGP 7.1.2 in its own
      # buildscript, which is too old for Gradle 9. Point it at Maven Central
      # and at the same AGP version this project uses. The package has no
      # newer release to upgrade to.
      - name: Patch flutter_tesseract_ocr for Gradle 9
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          settings = Path('android/settings.gradle.kts').read_text()
          match = re.search(r'com\.android\.application"\)\s+version\s+"([^"]+)"', settings)
          if not match:
              raise SystemExit('could not read the AGP version from settings.gradle.kts')
          agp = match.group(1)

          cache = Path(os.environ.get('PUB_CACHE', Path.home() / '.pub-cache'))
          plugins = sorted(cache.glob('hosted/pub.dev/flutter_tesseract_ocr-*'))
          if not plugins:
              raise SystemExit('flutter_tesseract_ocr is not in the pub cache')

          gradle = plugins[-1] / 'android/build.gradle'
          text = gradle.read_text()
          text = text.replace('jcenter()', 'mavenCentral()')
          text = re.sub(
              r'com\.android\.tools\.build:gradle:[\d.]+',
              f'com.android.tools.build:gradle:{agp}',
              text,
          )
          gradle.write_text(text)
          print(f'patched {gradle} (AGP {agp})')
          PY
          find "${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev" -maxdepth 1 \
            -name 'flutter_tesseract_ocr-*' -type d \
            -exec grep -n "mavenCentral\|com.android.tools.build:gradle" {}/android/build.gradle \;

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zaker-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
