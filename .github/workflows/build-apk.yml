name: Build APK

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Flutter release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The local build on the author's device points Flutter packages at an
      # SDK checkout next to the repository (`../vendor/flutter`). That folder
      # is not committed, so on CI they are switched to the SDK installed by
      # the action above.
      - name: Use the CI Flutter SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pubspec = Path('pubspec.yaml')
          text = pubspec.read_text()
          for package in ('flutter_test', 'flutter_localizations', 'flutter'):
              text = text.replace(f'path: ../vendor/flutter/{package}', 'sdk: flutter')
          pubspec.write_text(text)
          PY
          grep -n "sdk: flutter" pubspec.yaml

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # The repository keeps its Android sources and manifest, but not the
      # Gradle wrapper/templates, so Flutter regenerates the missing platform
      # scaffolding before building.
      - name: Generate Android platform files
        run: >
          flutter create
          --platforms=android
          --project-name zaker_ai
          --org com.zaker
          --no-pub
          .

      # The app's launch surface and label are committed resources. The
      # generation step above must never replace them; fail loudly if it does.
      - name: Verify brand resources survived project generation
        run: |
          grep -q '@drawable/launch_background' android/app/src/main/res/values/styles.xml
          grep -q 'rafiq_navy' android/app/src/main/res/values/styles.xml
          grep -q 'رفيق الطالب' android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          echo "brand resources intact"

      # flutter_local_notifications schedules with java.time, so the app module
      # must enable core-library desugaring (the plugin enables it for its own
      # module, but AGP also requires the consuming app to opt in). The Gradle
      # file is generated by the step above, so patch it before building.
      - name: Enable core-library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/app/build.gradle.kts')
          text = path.read_text()
          marker = 'compileOptions {'
          if marker not in text:
              raise SystemExit('unexpected Gradle template: compileOptions not found')
          if 'isCoreLibraryDesugaringEnabled' not in text:
              text = text.replace(
                  marker,
                  marker + '\n        isCoreLibraryDesugaringEnabled = true',
                  1,
              )
          if 'coreLibraryDesugaring' not in text:
              text += '''
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          '''
          path.write_text(text)
          PY
          grep -n "isCoreLibraryDesugaringEnabled\|coreLibraryDesugaring" android/app/build.gradle.kts

      # AGP 9 rejects an explicit android:extractNativeLibs="true" in the
      # manifest.  The recovered manifest sets it (the original APK extracts
      # its .so files at install time); the supported equivalent is legacy
      # JNI packaging in the app's build script.
      - name: Configure legacy JNI packaging
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/app/build.gradle.kts')
          text = path.read_text()
          if 'useLegacyPackaging' not in text:
              text += '''
          android {
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }
          '''
              path.write_text(text)
          PY
          grep -n "useLegacyPackaging" android/app/build.gradle.kts

      # Release builds must stay unminified: R8 full mode can strip classes
      # that Flutter plugins and the native MethodChannel reach reflectively
      # (Tesseract in particular), which makes the APK crash on launch. Keep
      # resource shrinking off too, and pin the release ABI set explicitly so
      # the packaged .so files always cover 64-bit and 32-bit ARM devices.
      - name: Pin release build flags (no R8, explicit ABIs)
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/app/build.gradle.kts')
          text = path.read_text()
          if 'isMinifyEnabled = false' not in text:
              text += '''
          android {
              defaultConfig {
                  ndk {
                      abiFilters += listOf("arm64-v8a", "armeabi-v7a")
                  }
              }
              buildTypes {
                  getByName("release") {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro",
                      )
                  }
              }
          }
          '''
              path.write_text(text)
          PY
          grep -n -E "isMinifyEnabled|isShrinkResources|abiFilters|proguard-rules" android/app/build.gradle.kts

      # Several plugin releases still compile against android-34, but
      # flutter_plugin_android_lifecycle now requires consumers to compile
      # against android-36 (AGP's AAR metadata check fails the build
      # otherwise). Raise every cached plugin module's compileSdk; bumping
      # compileSdk does not change targetSdk or minSdk behaviour.
      - name: Raise plugin compileSdk to 36
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          cache = Path(os.environ.get('PUB_CACHE', Path.home() / '.pub-cache'))
          plugin_dirs = cache / 'hosted' / 'pub.dev'
          pattern = re.compile(r'(compileSdk(?:Version)?\s*[= ]\s*)(\d+)')

          changed = []
          for name in ('build.gradle', 'build.gradle.kts'):
              for gradle in sorted(plugin_dirs.glob(f'*/android/{name}')):
                  text = gradle.read_text()
                  new = pattern.sub(
                      lambda m: m.group(1) + str(max(int(m.group(2)), 36)),
                      text,
                  )
                  if new != text:
                      gradle.write_text(new)
                      changed.append(gradle)
          if changed:
              for gradle in changed:
                  print(f'compileSdk -> 36: {gradle}')
          else:
              print('all plugin build files already compile against 36+')
          PY
          grep -R -n -E "compileSdk(Version)?[ =]+3[0-5]\b" \
            "${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev"/*/android/build.gradle* \
            && echo 'still below 36' >&2 && exit 1 || true

      # flutter_tesseract_ocr 0.4.31 (the latest release) still declares
      # `jcenter()`, which Gradle 9 removed, and pins AGP 7.1.2 in its own
      # buildscript, which is too old for Gradle 9. Point it at Maven Central
      # and at the same AGP version this project uses. The package has no
      # newer release to upgrade to.
      - name: Patch flutter_tesseract_ocr for Gradle 9
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          settings = Path('android/settings.gradle.kts').read_text()
          match = re.search(r'com\.android\.application"\)\s+version\s+"([^"]+)"', settings)
          if not match:
              raise SystemExit('could not read the AGP version from settings.gradle.kts')
          agp = match.group(1)

          cache = Path(os.environ.get('PUB_CACHE', Path.home() / '.pub-cache'))
          plugins = sorted(cache.glob('hosted/pub.dev/flutter_tesseract_ocr-*'))
          if not plugins:
              raise SystemExit('flutter_tesseract_ocr is not in the pub cache')

          gradle = plugins[-1] / 'android/build.gradle'
          text = gradle.read_text()
          text = text.replace('jcenter()', 'mavenCentral()')
          text = re.sub(
              r'com\.android\.tools\.build:gradle:[\d.]+',
              f'com.android.tools.build:gradle:{agp}',
              text,
          )
          gradle.write_text(text)
          print(f'patched {gradle} (AGP {agp})')
          PY
          find "${PUB_CACHE:-$HOME/.pub-cache}/hosted/pub.dev" -maxdepth 1 \
            -name 'flutter_tesseract_ocr-*' -type d \
            -exec grep -n "mavenCentral\|com.android.tools.build:gradle" {}/android/build.gradle \;

      - name: Run tests
        run: flutter test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zaker-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
