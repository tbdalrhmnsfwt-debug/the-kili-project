name: Build APK

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Flutter release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The local build on the author's device points Flutter packages at an
      # SDK checkout next to the repository (`../vendor/flutter`). That folder
      # is not committed, so on CI they are switched to the SDK installed by
      # the action above.
      - name: Use the CI Flutter SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pubspec = Path('pubspec.yaml')
          text = pubspec.read_text()
          for package in ('flutter_test', 'flutter_localizations', 'flutter'):
              text = text.replace(f'path: ../vendor/flutter/{package}', 'sdk: flutter')
          pubspec.write_text(text)
          PY
          grep -n "sdk: flutter" pubspec.yaml

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # The repository keeps its Android sources and manifest, but not the
      # Gradle wrapper/templates, so Flutter regenerates the missing platform
      # scaffolding before building.
      - name: Generate Android platform files
        run: >
          flutter create
          --platforms=android
          --project-name zaker_ai
          --org com.zaker
          --no-pub
          .

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zaker-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
